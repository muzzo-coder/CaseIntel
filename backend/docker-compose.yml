services:
  db:
    image: postgres:16-alpine
    container_name: caseintel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caseintel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseintel_password}
      POSTGRES_DB: ${POSTGRES_DB:-caseintel_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caseintel_user} -d ${POSTGRES_DB:-caseintel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caseintel-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caseintel_user}:${POSTGRES_PASSWORD:-caseintel_password}@db:5432/${POSTGRES_DB:-caseintel_db}
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
